name: Auto Merge Exercism PRs

on:
  pull_request:
    types: [opened, synchronized]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Solo se ejecuta si el PR fue creado por el bot de Exercism
    if: github.actor == 'exercism-solutions-syncer[bot]'
    
    steps:
      - name: Auto-merge Exercism PR
        run: gh pr merge "${{ github.event.pull_request.html_url }}" --merge --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
